services:
  postgres:
    image: postgres:16-alpine
    container_name: dcomp-postgres
    environment:
      POSTGRES_USER: dcomp
      POSTGRES_PASSWORD: dcomp
      POSTGRES_DB: dcomp_drive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcomp -d dcomp_drive"]
      interval: 5s
      timeout: 5s
      retries: 5

  controller:
    build: .
    container_name: dcomp-controller
    command: uvicorn src.controller.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dcomp:dcomp@postgres:5432/dcomp_drive
      - CONFIG_PATH=/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  node-1:
    build: .
    container_name: dcomp-node-1
    command: uvicorn src.storage_node.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=node-1
      - MACHINE_ID=machine-1
      - HOST_URL=http://node-1:8001
      - CONTROLLER_URL=http://controller:8000
      - DISK_MOUNTS=node-1:disk-a=/data/disk_a,node-1:disk-b=/data/disk_b
    volumes:
      - node1_disk_a:/data/disk_a
      - node1_disk_b:/data/disk_b
    depends_on:
      - controller

  node-2:
    build: .
    container_name: dcomp-node-2
    command: uvicorn src.storage_node.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - NODE_ID=node-2
      - MACHINE_ID=machine-2
      - HOST_URL=http://node-2:8002
      - CONTROLLER_URL=http://controller:8000
      - DISK_MOUNTS=node-2:disk-a=/data/disk_a,node-2:disk-b=/data/disk_b
    volumes:
      - node2_disk_a:/data/disk_a
      - node2_disk_b:/data/disk_b
    depends_on:
      - controller

  node-3:
    build: .
    container_name: dcomp-node-3
    command: uvicorn src.storage_node.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      - NODE_ID=node-3
      - MACHINE_ID=machine-3
      - HOST_URL=http://node-3:8003
      - CONTROLLER_URL=http://controller:8000
      - DISK_MOUNTS=node-3:disk-a=/data/disk_a,node-3:disk-b=/data/disk_b
    volumes:
      - node3_disk_a:/data/disk_a
      - node3_disk_b:/data/disk_b
    depends_on:
      - controller

  node-4:
    build: .
    container_name: dcomp-node-4
    command: uvicorn src.storage_node.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      - NODE_ID=node-4
      - MACHINE_ID=machine-4
      - HOST_URL=http://node-4:8004
      - CONTROLLER_URL=http://controller:8000
      - DISK_MOUNTS=node-4:disk-a=/data/disk_a,node-4:disk-b=/data/disk_b
    volumes:
      - node4_disk_a:/data/disk_a
      - node4_disk_b:/data/disk_b
    depends_on:
      - controller

  node-5:
    build: .
    container_name: dcomp-node-5
    command: uvicorn src.storage_node.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    environment:
      - NODE_ID=node-5
      - MACHINE_ID=machine-5
      - HOST_URL=http://node-5:8005
      - CONTROLLER_URL=http://controller:8000
      - DISK_MOUNTS=node-5:disk-a=/data/disk_a,node-5:disk-b=/data/disk_b
    volumes:
      - node5_disk_a:/data/disk_a
      - node5_disk_b:/data/disk_b
    depends_on:
      - controller

volumes:
  postgres_data:
  node1_disk_a:
  node1_disk_b:
  node2_disk_a:
  node2_disk_b:
  node3_disk_a:
  node3_disk_b:
  node4_disk_a:
  node4_disk_b:
  node5_disk_a:
  node5_disk_b:
